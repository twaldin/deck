# mcpx server catalog — copy to ~/.deck/catalog/mcpx.toml (SPEC §7).
#
# [servers.<name>]
# transport = "http" | "stdio"
# url       = "https://…"          # http only
# command   = "/path/to/server"    # stdio only (spawned per invocation)
# args      = ["--flag"]           # stdio only
# auth      = "none" | "broker"    # broker => tokenCommand supplies a bearer
# tokenCommand = "cat ~/.deck/broker/tool-token"   # stdout = token

[servers.linear]
transport = "http"
url = "https://mcp.linear.app/mcp"
auth = "none"

[servers.example-stdio]
transport = "stdio"
command = "bun"
args = ["/path/to/server.ts"]
auth = "none"
