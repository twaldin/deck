name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  v2-tests:
    name: v2 tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install v2 dependencies
        working-directory: v2
        run: bun install --frozen-lockfile
      - name: Install CLI dependencies
        working-directory: cli
        run: bun install --frozen-lockfile
      - name: Run v2 tests
        working-directory: v2
        run: bun test test/

  pipeline-tests:
    name: pipeline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install Smithers workspace dependencies
        working-directory: workflows/.smithers
        run: bun install --frozen-lockfile
      - name: Install pipeline dependencies
        working-directory: workflows/pr-pipeline
        run: bun install --frozen-lockfile
      - name: Run pipeline tests
        working-directory: workflows/pr-pipeline
        run: bun test

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install v2 dependencies
        working-directory: v2
        run: bun install --frozen-lockfile
      - name: Typecheck v2
        working-directory: v2
        run: bunx tsc --noEmit
      - name: Install broker dependencies
        working-directory: broker
        run: bun install
      - name: Typecheck broker
        working-directory: broker
        run: bunx tsc --noEmit
