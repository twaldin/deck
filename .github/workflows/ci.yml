name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ops-tests:
    name: ops tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install v2 dependencies
        working-directory: v2
        run: bun install --frozen-lockfile
      - name: Run home contract tests
        working-directory: ops
        run: bun test home-v4.test.ts
      - name: Run ops tests
        run: ./ops/resource-monitor.test.sh

  clean-install:
    name: clean clone install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Bootstrap a sandbox home from a clean clone
        env:
          DECK_VERIFY_REF: HEAD
        run: ./ops/verify-clean-install.sh

  v2-tests:
    name: v2 tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install v2 dependencies
        working-directory: v2
        run: bun install --frozen-lockfile
      - name: Install broker dependencies
        working-directory: broker
        run: bun install --frozen-lockfile
      - name: Install CLI dependencies
        working-directory: cli
        run: bun install --frozen-lockfile
      - name: Install extension test dependencies
        working-directory: extensions-pi
        run: bun install --frozen-lockfile
      - name: Install subagent test dependencies
        working-directory: subagents
        run: bun install --frozen-lockfile
      - name: Run v2 tests
        working-directory: v2
        run: bun test test/

      - name: Run extension tests
        working-directory: extensions-pi
        run: bun test test/
      - name: Run subagent tests
        working-directory: subagents
        run: bun test test/
  pipeline-tests:
    name: pipeline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install Smithers workspace dependencies
        working-directory: workflows/.smithers
        run: bun install --frozen-lockfile
      - name: Install pipeline dependencies
        working-directory: workflows/pr-pipeline
        run: bun install --frozen-lockfile
      - name: Run pipeline tests
        working-directory: workflows/pr-pipeline
        run: bun test
      - name: Typecheck pipeline
        working-directory: workflows/pr-pipeline
        run: bun run typecheck


  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install v2 dependencies
        working-directory: v2
        run: bun install --frozen-lockfile
      - name: Typecheck v2
        working-directory: v2
        run: bunx tsc --noEmit
      - name: Install broker dependencies
        working-directory: broker
        run: bun install
      - name: Typecheck broker
        working-directory: broker
        run: bunx tsc --noEmit
